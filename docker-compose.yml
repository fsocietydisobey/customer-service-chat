# docker-compose.yml (Base configuration)

services:
  app:
    build: .
    image: fsocietydisobey/customer-chat-app:v1.0
    container_name: chat-app
    # Note: Ports might also differ, but let's assume 3000 is for dev/prod for now
    ports:
      - "3000:3000"
    volumes:
      # In production, you typically wouldn't mount host code
      # but for dev, this is good. We'll override this.
      - .:/app
      - /app/node_modules
    environment:
      # These variables will be overridden by environment-specific files
      # MONGO_URI will be different
      JWT_SECRET: your_super_secret_jwt_key_for_agents # **IMPORTANT: REPLACE WITH A SECURE SECRET**
      PORT: 3000
    depends_on:
      # This dependency will be meaningful in dev, and potentially removed/changed in prod
      - mongodb # Placeholder for database dependency