<!-- public/agent_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h2>Agent Portal Login</h2>
    <form id="agentLoginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <hr>
    <p>New Agent? You can register here (for demo purposes):</p>
    <form id="agentRegisterForm">
        <input type="text" id="regUsername" placeholder="Username" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <select id="regRole" required>
            <option value="agent">Agent</option>
            <!-- <option value="admin">Admin</option> -->
        </select>
        <button type="submit">Register Agent</button>
    </form>
    <p id="regMessage"></p>
</div>

<!-- ADDED: Socket.IO client library -->
<script src="/socket.io/socket.io.js"></script>
<script src="/agent_script.js"></script>
</body>
</html>
